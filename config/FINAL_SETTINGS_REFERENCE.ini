# FINAL LOCKED ReyT settings reference - 2026-08-16
# Secrets intentionally omitted. Deployment helper preserves MYSQL_PASSWORD /
# BALE_BOT_TOKEN / BALE_CHAT_ID from live VPS settings.ini.

# ======================== COLLECTOR ========================
[collector]
COLLECTOR_DB_POOL_MIN = 1
COLLECTOR_DB_POOL_MAX = 8
TSETMC_API_BASE_URL = https://cdn.tsetmc.com/api
COLLECTOR_HTTP_TIMEOUT = 20
COLLECTOR_HTTP_RETRIES = 3
COLLECTOR_HTTP_CONNECTOR_LIMIT = 60
COLLECTOR_REALTIME_INTERVAL = 5
COLLECTOR_UNDERLYING_INTERVAL = 60
COLLECTOR_ORDER_BOOK_INTERVAL = 15
COLLECTOR_ORDER_BOOK_BATCH_SIZE = 300
COLLECTOR_ORDER_BOOK_CONCURRENCY = 30
COLLECTOR_ORDER_BOOK_INCLUDE_UNDERLYINGS = yes
COLLECTOR_UNDERLYING_CONCURRENCY = 8

# History policy: bootstrap once, then append one completed daily row at 13:00.
COLLECTOR_INITIAL_HISTORY_DAYS = 252
COLLECTOR_EOD_HISTORY_LOOKBACK_DAYS = 7
COLLECTOR_EOD_HISTORY_TIME = 13:00
COLLECTOR_HISTORY_CONCURRENCY = 4
COLLECTOR_HISTORY_REQUEST_DELAY = 0.20
# NO history pruning / retention cap.

COLLECTOR_DB_DEADLOCK_RETRIES = 5
COLLECTOR_DB_DEADLOCK_BASE_DELAY = 0.50
COLLECTOR_CALCULATE_GREEKS = yes
MARKET_OPEN = 09:00
MARKET_CLOSE = 12:30

[greeks]
GREEKS_RISK_FREE_RATE = 0.40
GREEKS_DIVIDEND_YIELD = 0.0
GREEKS_MAX_IV = 5.0
GREEKS_MIN_IV = 0.000001
GREEKS_MAX_NEWTON_ITER = 30
GREEKS_NEWTON_TOL = 0.0000001
GREEKS_BISECTION_ITER = 60
GREEKS_SPREAD_THRESHOLD = 0.10

# ======================== STRATEGY ========================
[paper]
PAPER_ACCOUNT_NAME = paper_100m_toman
PAPER_INITIAL_CAPITAL_TOMAN = 100000000
PAPER_FIXED_RISK_PER_TRADE_TOMAN = 1000000
PAPER_MIN_EXECUTION_RISK_TOMAN = 200000
PAPER_MAX_STRATEGY_ALLOCATION_PCT = 30
PAPER_CC_MIN_ITM_PCT = 10
# Final executed position Max Loss must be >= 200,000 toman after VWAP/portfolio constraints.
PAPER_AUTO_TRADE = yes
PAPER_ALLOWED_UNDERLYINGS = اهرم,وبملت,شپنا,فملی,شستا
# Score is context/ranking only, not an entry floor.
PAPER_AUTO_TRADE_MIN_SCORE = 60
# DTE is an actual structural entry filter in v2.
PAPER_MIN_DAYS_TO_EXPIRY = 5
PAPER_MAX_DAYS_TO_EXPIRY = 180

PAPER_MAX_STRIKE_STEPS = 4
PAPER_MAX_ENTRY_BOOK_AGE_SECONDS = 150
PAPER_MAX_MARK_BOOK_AGE_SECONDS = 900
PAPER_OPTION_VOLUME_MODE = auto
PAPER_OPTION_VOLUME_AUTO_FALLBACK = contracts

# Approx. one trading year of realized-volatility/history context.
PAPER_VOLATILITY_LOOKBACK_DAYS = 252
PAPER_MIN_VOLATILITY_RETURNS = 90

# Economic signal hurdle.
PAPER_EXPECTED_RETURN_HURDLE_EAR = 0.40
PAPER_EXPECTED_RETURN_REQUIRE_BOTH_MODELS = yes
PAPER_EXPECTED_RETURN_HISTORY_ROWS = 252
PAPER_EXPECTED_RETURN_MIN_HISTORY_RETURNS = 90
PAPER_EXPECTED_RETURN_BOOTSTRAP_PATHS = 2500
PAPER_EXPECTED_RETURN_IV_QUANTILE_PATHS = 2001
PAPER_EXPECTED_RETURN_TRADING_DAYS = 252
PAPER_EXPECTED_RETURN_CALENDAR_DAYS = 365
PAPER_EXPECTED_RETURN_HISTORY_CACHE_SECONDS = 300

# Standard fee schedule; values are percent, not decimal fractions.
PAPER_UNDERLYING_BUY_FEE_PCT = 0.3712
PAPER_UNDERLYING_SELL_FEE_PCT = 0.88
PAPER_OPTION_BUY_FEE_PCT = 0.103
PAPER_OPTION_SELL_FEE_PCT = 0.103
PAPER_OPTION_EXPIRY_FEE_PCT = 0.05

[strategy]
STRATEGY_DB_POOL_MIN = 1
STRATEGY_DB_POOL_MAX = 5

# ======================== BALE ========================
[bale]
PAPER_ACCOUNT_NAME = paper_100m_toman
BALE_HTTP_TIMEOUT = 30
BALE_HTTP_RETRIES = 4
BALE_SIGNAL_POLL_SECONDS = 2
BALE_SIGNAL_MODE = executed_only
BALE_SIGNAL_OVERLAP_SECONDS = 5
BALE_QUERY_BATCH_SIZE = 2000
BALE_STATE_DB_PATH = /opt/reyt/bale/reyt_bale_notifier_state.sqlite3
BALE_REPORT_DIR = /opt/reyt/bale/reports
