# ReyT Short Premium - isolated runtime reference
# Secrets are intentionally omitted.

[database]
MYSQL_HOST = 127.0.0.1
MYSQL_PORT = 3306
MYSQL_DATABASE = ghazali1_ReyTOption
MYSQL_USER = reyt_app
# MYSQL_PASSWORD =
MYSQL_CHARSET = utf8mb4
MYSQL_TIME_ZONE = +03:30
MYSQL_CONNECT_TIMEOUT = 20
MYSQL_SSL = no

[short_premium]
STRADDLE_ACCOUNT_NAME = paper_100m_short_straddle
STRANGLE_ACCOUNT_NAME = paper_100m_short_strangle
INITIAL_CAPITAL_TOMAN = 100000000
ALLOWED_UNDERLYINGS = شستا,شپنا,وبملت,اهرم,فملی

MIN_DTE = 5
MAX_DTE = 30

MARKET_START = 09:15
NEW_ENTRY_CUTOFF = 12:15
MARKET_END = 12:30
SCAN_INTERVAL_SECONDS = 300
MARKET_HOLIDAYS =
SCHEDULED_EXIT_TIME = 12:00

ENTRY_BUCKET_PCT = 70
ADJUSTMENT_BUCKET_PCT = 30

MIN_POSITION_VALUE_TOMAN = 500000
MAX_POSITION_MARGIN_TOMAN = 10000000
MIN_NET_PREMIUM_TO_MARGIN_PCT = 10
MAX_IMMEDIATE_CLOSE_LOSS_PCT = 50

STRADDLE_STRESS_PCT = 8
STRANGLE_STRESS_PCT = 10
MAX_LOSS_ZONE_DISTANCE_PCT = 5

MARGIN_A_PCT = 20
MARGIN_B_PCT = 10
MARGIN_ROUNDING_RIAL = 10000

OPTION_SELL_FEE_PCT = 0.103
OPTION_BUY_FEE_PCT = 0.103

QUOTE_MAX_AGE_SECONDS = 120
OPTION_VOLUME_MODE = auto
OPTION_VOLUME_AUTO_FALLBACK = contracts

DB_POOL_MIN = 1
DB_POOL_MAX = 4

# Scheduled exit is the only path allowed to consume ask Level 2.
SCHEDULED_EXIT_USE_LEVEL2 = yes

[short_premium_telegram]
# BOT_TOKEN =
# CHAT_ID =
HTTP_TIMEOUT = 30
HTTP_RETRIES = 4
POLL_SECONDS = 2
CFW_SESSION = /var/lib/reyt/telegram/cfw.session
REPORT_TIME_MORNING = 08:30
REPORT_TIME_EOD = 13:00
STATE_DB_PATH = /var/lib/reyt/short-premium/notifier_state.sqlite3
